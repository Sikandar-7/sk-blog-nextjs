# Serving an Astro `format: 'directory'` build.
#
# Every route is its own folder with an index.html, so there is no SPA fallback
# here on purpose — rewriting unknown paths to index.html would turn a typo into
# a page that renders the homepage under the wrong URL and returns 200 to
# crawlers. A missing page should say so.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # $uri/ lets nginx 301 /blog/post to /blog/post/ the way the build expects.
    location / {
        try_files $uri $uri/ =404;
    }

    # Astro emits 404.html; without this nginx serves its own unbranded page.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Fingerprinted assets under /_astro are immutable — the hash changes when
    # the content does, so a long cache is safe. Everything else revalidates,
    # which matters for a blog where a published article should appear promptly.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;
}
